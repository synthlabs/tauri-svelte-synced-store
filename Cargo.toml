[package]
name = "tauri-svelte-synced-store"
version = "0.2.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.28", features = ["derive", "function"] }
tauri = { version = "2.12", default-features = false, features = ["wry", "specta"] }
tauri-plugin-store = "2.5"
tracing = "0.1.41"

[dev-dependencies]
specta-typescript = "0.0.15"
tauri = { version = "2.12", default-features = false, features = ["test"] }
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
tracing-subscriber = "0.3.19"
